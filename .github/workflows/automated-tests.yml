name: Automated Tests

on:
  push:
    paths:
      - 'Nexus-Team/Dockerfile.unit-test'
      - 'Nexus-Team/Dockerfile.e2e-test'
      - 'Nexus-Team/docker-compose.yaml'
      - 'Nexus-Team/src/**'
      - 'Nexus-Team/tests/**'
      - '.github/workflows/automated-tests.yml'
  pull_request:
    paths:
      - 'Nexus-Team/Dockerfile.unit-test'
      - 'Nexus-Team/Dockerfile.e2e-test'
      - 'Nexus-Team/docker-compose.yaml'
      - 'Nexus-Team/src/**'
      - 'Nexus-Team/tests/**'
      - '.github/workflows/automated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run required unit-test baseline
        working-directory: Nexus-Team
        run: >-
          docker compose run --rm --build
          -e TEST_FILTER="Category!=Regression"
          unit-test

      - name: Exercise documented unit regressions
        continue-on-error: true
        working-directory: Nexus-Team
        run: >-
          docker compose run --rm
          -e TEST_FILTER="Category=Regression"
          unit-test

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run required E2E baseline against isolated services
        working-directory: Nexus-Team
        run: >-
          docker compose --profile e2e-test run --rm --build
          -e TEST_FILTER="Category!=Regression"
          e2e-test

      - name: Exercise documented E2E regressions
        continue-on-error: true
        working-directory: Nexus-Team
        run: >-
          docker compose --profile e2e-test run --rm
          --no-deps
          -e TEST_FILTER="Category=Regression"
          e2e-test

      - name: Collect isolated service logs on failure
        if: failure()
        working-directory: Nexus-Team
        run: >-
          docker compose --profile e2e-test logs
          --no-color --tail=200
          server-e2e db-seeder-e2e redis-e2e mongo-e2e oracle-e2e

      - name: Shut down isolated test infrastructure
        if: always()
        working-directory: Nexus-Team
        run: |
          docker compose --profile e2e-test stop \
            server-e2e db-seeder-e2e redis-e2e mongo-e2e oracle-e2e
          docker compose --profile e2e-test rm --force \
            server-e2e db-seeder-e2e redis-e2e mongo-e2e oracle-e2e
