<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NexusTeam Messenger</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-window" aria-label="NexusTeam Messenger">
      <header class="titlebar">
        <div class="title-brand">
          <span class="diamond">♦</span>
          <span>Nexus Team</span>
        </div>
        <nav class="view-tabs" aria-label="Application screens">
          <button class="view-tab is-active" type="button" data-screen="login">Login</button>
          <button class="view-tab" type="button" data-screen="register">Registration</button>
          <button class="view-tab" type="button" data-screen="messenger">Messenger</button>
        </nav>
        <div class="window-actions" aria-hidden="true">
          <span>—</span>
          <span>□</span>
          <span>×</span>
        </div>
      </header>

      <section class="screen auth-screen is-active" data-screen-panel="login">
        <form class="auth-card" aria-label="Login form">
          <h1>Welcome Back</h1>
          <p class="subtitle">Sign in to continue to NexusTeam</p>

          <label>
            <span>Username or Email</span>
            <input type="text" value="anastasia@nexusteam.dev">
          </label>

          <label>
            <span>Password</span>
            <input type="password" value="nexusteam">
          </label>

          <label class="remember">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>

          <button class="primary-button" type="button">Sign In</button>

          <div class="divider">
            <span></span>
            <p>Or log in using:</p>
            <span></span>
          </div>

          <div class="social-row" aria-label="Social login buttons">
            <button type="button">G</button>
            <button type="button">GH</button>
            <button type="button">f</button>
            <button type="button">M</button>
          </div>

          <div class="auth-switch">
            <button class="is-selected" type="button" data-screen="login">Sign in</button>
            <button type="button" data-screen="register">Sign up</button>
          </div>
        </form>
      </section>

      <section class="screen auth-screen" data-screen-panel="register">
        <form class="auth-card register-card" aria-label="Registration form">
          <h1>Create account</h1>
          <p class="subtitle">Join NexusTeam today</p>

          <label>
            <span>Username</span>
            <input type="text" value="sofiia">
          </label>

          <label>
            <span>Email</span>
            <input type="email" value="sofiia@nexusteam.dev">
          </label>

          <label>
            <span>Display Name</span>
            <input type="text" value="Sofiia">
          </label>

          <label>
            <span>Password</span>
            <input type="password" value="nexusteam">
          </label>
          <p class="password-hint">Password must be at least 8 characters and contain uppercase, lowercase, and a digit</p>

          <label>
            <span>Confirm Password</span>
            <input type="password" value="nexusteam">
          </label>

          <button class="primary-button" type="button">Create Account</button>

          <div class="auth-switch">
            <button type="button" data-screen="login">Sign in</button>
            <button class="is-selected" type="button" data-screen="register">Sign up</button>
          </div>
        </form>
      </section>

      <section class="screen messenger-screen" data-screen-panel="messenger">
        <div class="messenger-layout">
          <aside class="folders-panel" aria-label="Chat folders">
            <div class="folder is-active">
              <span>💬</span>
              <small>All</small>
            </div>
            <div class="folder">
              <span>📁</span>
              <small>Work</small>
            </div>
            <div class="folder">
              <span>📁</span>
              <small>Study</small>
            </div>
            <button class="round-button" type="button">+</button>
            <div class="folder-bottom">
              <button class="round-button" type="button">🖼</button>
              <button class="round-button" type="button">⚙</button>
            </div>
          </aside>

          <aside class="chat-panel" aria-label="Chats">
            <div class="panel-header">
              <h2>Chats</h2>
              <div class="mini-actions">
                <button type="button">+</button>
                <button type="button">↻</button>
              </div>
            </div>

            <div class="search-field">
              <span>⌕</span>
              <input type="text" value="Search chats...">
            </div>

            <div class="chat-list">
              <button class="chat-preview is-active" type="button" data-chat="anna">
                <span class="avatar online">A</span>
                <span class="chat-copy">
                  <strong>Anna</strong>
                  <small>Can you review the UI today?</small>
                </span>
                <span class="chat-meta">
                  <time>10:42</time>
                  <b>2</b>
                </span>
              </button>

              <button class="chat-preview" type="button" data-chat="team">
                <span class="avatar away">M</span>
                <span class="chat-copy">
                  <strong>Messenger Team</strong>
                  <small>Login and register screens are ready.</small>
                </span>
                <span class="chat-meta">
                  <time>09:15</time>
                </span>
              </button>

              <button class="chat-preview" type="button" data-chat="diana">
                <span class="avatar online">D</span>
                <span class="chat-copy">
                  <strong>Diana</strong>
                  <small>Let's keep the layout close to desktop.</small>
                </span>
                <span class="chat-meta">
                  <time>Tue</time>
                </span>
              </button>

              <button class="chat-preview" type="button" data-chat="matvei">
                <span class="avatar busy">M</span>
                <span class="chat-copy">
                  <strong>Matvei</strong>
                  <small>I added fake data for the chat list.</small>
                </span>
                <span class="chat-meta">
                  <time>Mon</time>
                  <b>1</b>
                </span>
              </button>
            </div>
          </aside>

          <section class="conversation-panel" aria-label="Selected conversation">
            <header class="conversation-header">
              <div class="profile-summary">
                <span class="avatar online" data-selected-avatar>A</span>
                <div>
                  <h2 data-selected-name>Anna</h2>
                  <p data-selected-status>Online</p>
                </div>
              </div>

              <button class="icon-button" type="button">☎</button>

              <div class="message-search">
                <span>⌕</span>
                <input type="text" value="Search messages...">
                <button type="button">×</button>
              </div>
            </header>

            <div class="messages" data-messages></div>

            <footer class="composer">
              <div class="message-input">
                <button type="button">📎</button>
                <span>Type a message...</span>
                <button type="button">☺</button>
              </div>
              <button class="send-button" type="button">➤</button>
              <button class="send-button" type="button">🎙</button>
            </footer>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
