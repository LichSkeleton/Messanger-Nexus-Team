# ============================================================================
# NexusTeam web frontend - Nginx configuration
# Serves the static SPA and reverse-proxies the API + WebSocket to the
# .NET server container so the whole app is same-origin (no CORS needed).
# ============================================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # File attachments can be up to 100 MB (voice notes, docs, images).
    client_max_body_size 110m;

    # Use Docker's embedded DNS so proxy targets are resolved at request time.
    # This lets the web container start even if the API isn't up yet (it just
    # returns 502 until the server is ready) instead of failing at startup.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # gzip static assets for faster mobile loads
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ---- Static SPA ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell so updates are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- REST API -----------------------------------------------------------
    location /api/ {
        set                $api_backend "server:5251";
        proxy_pass         http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads straight through instead of spooling them to disk.
        proxy_request_buffering off;
    }

    # ---- WebSocket (real-time messaging) ------------------------------------
    location /ws {
        set                $ws_backend "server:5251";
        proxy_pass         http://$ws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Real-time frames must not sit in a buffer waiting to be filled.
        proxy_buffering off;
    }

    # ---- Health check -------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
