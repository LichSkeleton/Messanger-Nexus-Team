services:
  # ============================================================================
  # Redis - Cache, Sessions, Presence
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: nexusteam_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusteam_network

  # ============================================================================
  # Oracle Database - Users, Email Verifications
  # ============================================================================
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: nexusteam_oracle
    ports:
      - "1530:1521"
    environment:
      ORACLE_PASSWORD: "060707"
      APP_USER: nexusteam_admin
      APP_USER_PASSWORD: "060707"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh XEPDB1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - nexusteam_network

  # ============================================================================
  # MongoDB Sharded Cluster - Chats, Messages, Attachments, User Preferences
  # ============================================================================

  # Config Server (Replica Set)
  mongo-config:
    image: mongo:7
    container_name: nexusteam_mongo_config
    command: mongod --configsvr --replSet configReplSet --port 27017 --dbpath /data/db --bind_ip_all
    ports:
      - "27019:27017"
    volumes:
      - mongo_config_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexusteam_network

  # Shard 1 (Replica Set)
  mongo-shard1:
    image: mongo:7
    container_name: nexusteam_mongo_shard1
    command: mongod --shardsvr --replSet shard1ReplSet --port 27017 --dbpath /data/db --bind_ip_all
    ports:
      - "27020:27017"
    volumes:
      - mongo_shard1_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexusteam_network

  # Shard 2 (Replica Set)
  mongo-shard2:
    image: mongo:7
    container_name: nexusteam_mongo_shard2
    command: mongod --shardsvr --replSet shard2ReplSet --port 27017 --dbpath /data/db --bind_ip_all
    ports:
      - "27021:27017"
    volumes:
      - mongo_shard2_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexusteam_network

  # MongoDB Initialization Service - Initializes replica sets before mongos starts
  mongo-init:
    image: mongo:7
    container_name: nexusteam_mongo_init
    depends_on:
      mongo-config:
        condition: service_healthy
      mongo-shard1:
        condition: service_healthy
      mongo-shard2:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Initializing Config Server Replica Set..."
        mongosh --host mongo-config:27017 --eval "
          try {
            rs.initiate({
              _id: 'configReplSet',
              configsvr: true,
              members: [{ _id: 0, host: 'mongo-config:27017' }]
            })
            print('Config Server initialized')
          } catch (e) {
            if (e.message.includes('already') || e.codeName === 'AlreadyInitialized') {
              print('Config Server already initialized')
            } else {
              throw e
            }
          }
        "

        echo " Waiting for Config Server to be primary..."
        until mongosh --host mongo-config:27017 --quiet --eval "rs.isMaster().ismaster" | grep -q 'true'; do
          sleep 2
        done

        echo "Initializing Shard 1 Replica Set..."
        mongosh --host mongo-shard1:27017 --eval "
          try {
            rs.initiate({
              _id: 'shard1ReplSet',
              members: [{ _id: 0, host: 'mongo-shard1:27017' }]
            })
            print('Shard 1 initialized')
          } catch (e) {
            if (e.message.includes('already') || e.codeName === 'AlreadyInitialized') {
              print('Shard 1 already initialized')
            } else {
              throw e
            }
          }
        "
        echo "Waiting for Shard 1 to be primary..."
        until mongosh --host mongo-shard1:27017 --quiet --eval "rs.isMaster().ismaster" | grep -q 'true'; do
          sleep 2
        done

        echo "Initializing Shard 2 Replica Set..."
        mongosh --host mongo-shard2:27017 --eval "
          try {
            rs.initiate({
              _id: 'shard2ReplSet',
              members: [{ _id: 0, host: 'mongo-shard2:27017' }]
            })
            print('Shard 2 initialized')
          } catch (e) {
            if (e.message.includes('already') || e.codeName === 'AlreadyInitialized') {
              print('Shard 2 already initialized')
            } else {
              throw e
            }
          }
        "

        echo "Waiting for Shard 2 to be primary..."
        until mongosh --host mongo-shard2:27017 --quiet --eval "rs.isMaster().ismaster" | grep -q 'true'; do
          sleep 2
        done

        echo "All replica sets initialized successfully!"
    networks:
      - nexusteam_network

  # Mongos Router
  mongos:
    image: mongo:7
    container_name: nexusteam_mongos
    command: mongos --configdb configReplSet/mongo-config:27017 --port 27017 --bind_ip_all
    ports:
      - "27018:27017"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo-config:
        condition: service_healthy
      mongo-shard1:
        condition: service_healthy
      mongo-shard2:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexusteam_network

  # MongoDB Router Initialization - Registers shards with mongos
  mongo-router-init:
    image: mongo:7
    container_name: nexusteam_mongo_router_init
    depends_on:
      mongos:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Waiting for mongos to be ready..."
        until mongosh --host mongos:27017 --quiet --eval "db.adminCommand('ping').ok" | grep -q '1'; do
          sleep 2
        done

        echo "Registering shards with mongos..."
        mongosh --host mongos:27017 --eval "
          const existing = db.adminCommand({ listShards: 1 }).shards.map(s => s._id);
          function addShard(name, host) {
            if (existing.includes(name)) {
              print(name + ' already registered');
              return;
            }
            const result = sh.addShard(host);
            if (result.ok) {
              print('Added ' + name);
            } else {
              throw new Error(JSON.stringify(result));
            }
          }
          addShard('shard1ReplSet', 'shard1ReplSet/mongo-shard1:27017');
          addShard('shard2ReplSet', 'shard2ReplSet/mongo-shard2:27017');
          sh.enableSharding('NexusTeam');
        "

        echo "MongoDB router initialization complete!"
    networks:
      - nexusteam_network

  # ============================================================================
  # Database Seeder - C# Console Application
  # ============================================================================
  db-seeder:
    build:
      context: .
      dockerfile: src/NexusTeam.DbSeeder/Dockerfile
    container_name: nexusteam_db_seeder
    depends_on:
      oracle:
        condition: service_healthy
      mongo-router-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # MongoDB Configuration
      MONGODB_CONNECTION_STRING: "mongodb://mongos:27017"
      MONGODB_DATABASE: "NexusTeam"

      # Oracle Configuration (FIXED HOST NAME)
      ORACLE_CONNECTION_STRING: "Data Source=(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=oracle)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=XEPDB1)));User Id=nexusteam_admin;Password=060707;"

      # Redis Configuration (FIXED HOST NAME)
      REDIS_CONNECTION_STRING: "redis:6379,abortConnect=false,allowAdmin=true"

      # Seeder Configuration
      CONFIG_PATH: "/app/configs"
      RETRY_COUNT: "10"
      RETRY_DELAY_SECONDS: "5"
      ENABLE_SHARDING: "true"
      SHARD_COLLECTIONS: "messages,attachments"
    volumes:
      # Mount config directory as volume for hot-reload
      - ./config:/app/configs:ro
    networks:
      - nexusteam_network
    restart: on-failure

  # ============================================================================
  # NexusTeam Web API (.NET 8) - REST + WebSocket backend
  # ============================================================================
  server:
    build:
      context: .
      dockerfile: src/NexusTeam.Server/Dockerfile
    container_name: nexusteam_server
    depends_on:
      oracle:
        condition: service_healthy
      mongos:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully
    environment:
      # Point the server at the in-network database containers (override appsettings)
      Oracle__ConnectionString: "User Id=nexusteam_admin;Password=060707;Data Source=oracle:1521/XEPDB1"
      MongoDB__ConnectionString: "mongodb://mongos:27017"
      MongoDB__DatabaseName: "NexusTeam"
      Redis__ConnectionString: "redis:6379,abortConnect=false,allowAdmin=true"
      # Allow the browser client (served by Nginx) as a CORS origin
      Cors__AllowedOrigins__0: "http://localhost:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "5251:5251"
    networks:
      - nexusteam_network
    restart: on-failure

  # ============================================================================
  # NexusTeam Web Frontend (Nginx) - responsive universal client
  # Serves the SPA and reverse-proxies /api and /ws to the server container.
  # Open http://localhost:8080 on any device (desktop or mobile browser).
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nexusteam_web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - nexusteam_network
    restart: on-failure

volumes:
  redis_data:
    name: nexusteam_redis_data
  oracle_data:
    name: nexusteam_oracle_data
  mongo_config_data:
    name: nexusteam_mongo_config_data
  mongo_shard1_data:
    name: nexusteam_mongo_shard1_data
  mongo_shard2_data:
    name: nexusteam_mongo_shard2_data

networks:
  nexusteam_network:
    name: nexusteam_network
    driver: bridge