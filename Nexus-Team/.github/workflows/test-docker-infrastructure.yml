# GitHub Actions workflow to test Docker infrastructure
name: Test Docker Infrastructure

on:
  push:
    branches: [main, develop, feature/docker-*]
    paths:
      - 'Nexus-Team/docker-compose.yaml'
      - 'Nexus-Team/src/**'
      - 'Nexus-Team/web/**'
      - 'Nexus-Team/config/**'
      - '.github/workflows/test-docker-infrastructure.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Nexus-Team/docker-compose.yaml'
      - 'Nexus-Team/src/**'
      - 'Nexus-Team/web/**'
      - 'Nexus-Team/config/**'
      - '.github/workflows/test-docker-infrastructure.yml'
  workflow_dispatch:

jobs:
  test-infrastructure:
    name: Test Full Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `docker compose up` already blocks on every health check and on the
      # seeder's exit code, so reaching the next step means the whole stack
      # came up cleanly from empty volumes.
      - name: Start Docker Infrastructure
        run: |
          cd Nexus-Team
          docker compose up -d --build

      - name: Verify DB Seeder succeeded
        run: |
          exit_code=$(docker inspect nexusteam_db_seeder --format='{{.State.ExitCode}}')
          echo "Seeder exit code: $exit_code"

          if [ "$exit_code" -ne 0 ]; then
            echo "❌ Database seeder failed!"
            docker logs nexusteam_db_seeder
            exit 1
          fi

          echo "✓ Database seeder completed successfully!"

      - name: Show Seeder Logs
        run: |
          echo "=== Database Seeder Logs ==="
          docker logs nexusteam_db_seeder

      - name: Verify MongoDB Collections
        run: |
          echo "Verifying MongoDB collections..."
          docker exec nexusteam_mongos mongosh --eval "
            use NexusTeam;
            const collections = db.getCollectionNames();
            print('Collections: ' + collections.join(', '));
            
            if (!collections.includes('chats')) {
              throw new Error('Collection chats not found');
            }
            if (!collections.includes('messages')) {
              throw new Error('Collection messages not found');
            }
            if (!collections.includes('attachments')) {
              throw new Error('Collection attachments not found');
            }
            if (!collections.includes('user_preferences')) {
              throw new Error('Collection user_preferences not found');
            }
            
            print('✓ All collections exist');
          "

      - name: Verify MongoDB Indexes
        run: |
          echo "Verifying MongoDB indexes..."
          docker exec nexusteam_mongos mongosh --eval "
            use NexusTeam;
            const chatsIndexes = db.chats.getIndexes();
            print('Chats indexes: ' + chatsIndexes.length);
            
            if (chatsIndexes.length < 5) {
              throw new Error('Not enough indexes on chats collection');
            }
            
            print('✓ Indexes created successfully');
          "

      - name: Verify MongoDB Sharding
        run: |
          echo "Verifying MongoDB sharding..."
          docker exec nexusteam_mongos mongosh --eval "
            const status = sh.status();
            print('Shard status retrieved');
            
            const shards = db.getSiblingDB('config').shards.find().toArray();
            print('Number of shards: ' + shards.length);
            
            if (shards.length < 2) {
              throw new Error('Expected at least 2 shards, found ' + shards.length);
            }
            
            print('✓ Sharding configured correctly');
          "

      - name: Verify Oracle Tables and Demo Users
        run: |
          echo "Verifying Oracle schema..."
          docker exec nexusteam_oracle sh -c "
            echo \"SELECT username FROM users ORDER BY username;\" | \
            sqlplus -s nexusteam_admin/060707@//localhost:1521/FREEPDB1
          " | tee /tmp/oracle_users.txt

          for user in Vlad Sofia Hakan Anna; do
            if ! grep -q "$user" /tmp/oracle_users.txt; then
              echo "❌ Demo user $user not found in Oracle"
              exit 1
            fi
          done

          echo "✓ Oracle tables and demo users created successfully"

      - name: Verify Web Client and API
        run: |
          echo "Waiting for the web client to answer..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then break; fi
            sleep 5
          done

          curl -fsS http://localhost:8080/ >/dev/null
          echo "✓ SPA is served"

          curl -fsS http://localhost:5251/health | grep -q "Healthy"
          echo "✓ API reports healthy"

          # An unknown account must come back 401 from the API, which proves the
          # request travelled through Nginx and the server queried Oracle.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"usernameOrEmail":"no-such-user","password":"x"}' \
            http://localhost:8080/api/auth/login)

          if [ "$status" != "401" ]; then
            echo "❌ Expected 401 from /api/auth/login, got $status"
            docker compose -f Nexus-Team/docker-compose.yaml logs server --tail=50
            exit 1
          fi

          echo "✓ API is reachable through the Nginx reverse proxy"

      - name: Verify Redis Connection
        run: |
          echo "Verifying Redis connection..."
          docker exec nexusteam_redis redis-cli INFO server | grep "redis_version"
          echo "✓ Redis is operational"

      - name: Test Idempotency (Run Seeder Again)
        run: |
          echo "Testing idempotency..."
          cd Nexus-Team
          docker compose up db-seeder --force-recreate --exit-code-from db-seeder
          echo "✓ Seeding is idempotent"

      - name: Test Warm Restart (Existing Volumes)
        run: |
          echo "Testing a restart against already-populated volumes..."
          cd Nexus-Team
          docker compose down
          docker compose up -d
          docker compose ps

          curl -fsS --retry 20 --retry-delay 5 --retry-all-errors \
            http://localhost:5251/health | grep -q "Healthy"
          echo "✓ Stack recovers from a restart"

      - name: Collect Logs on Failure
        if: failure()
        run: |
          echo "=== All Container Logs ==="
          docker compose -f Nexus-Team/docker-compose.yaml logs --tail=100

      - name: Shutdown Infrastructure
        if: always()
        run: |
          cd Nexus-Team
          docker compose down -v

  test-dotnet-build:
    name: Test .NET Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The WPF client is Windows-only and deliberately excluded; the web
      # client needs no build step.
      - name: Build server and seeder
        run: |
          cd Nexus-Team
          dotnet build src/NexusTeam.Server/NexusTeam.Server.csproj -c Release
          dotnet build src/NexusTeam.DbSeeder/NexusTeam.DbSeeder.csproj -c Release
